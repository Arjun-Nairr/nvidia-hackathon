<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent workspace</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{const t=localStorage.getItem("ui-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch{/* storage unavailable: follow the system setting */}</script>
<style>
:root{color-scheme:light;--bg:#faf9f6;--side:#f4f2ed;--card:#fff;--soft:#f2f0ea;--ink:#1f2124;--mut:#63666a;--line:#e5e2da;--acc:#2d7658;--acc-d:#245f47;--acc-ink:#fff;--fg-acc:#2d7658;--acc-soft:#e3efe8;--warn:#a4402a;--warn-soft:#fbeeea;--bubble:#efece6;--hover:#ebe8e1;--sel:#e9e6df;--field:#fff;--imgbg:#efede8;--shadow:rgba(31,33,36,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#202124;--side:#1a1b1d;--card:#2a2c2f;--soft:#27292c;--ink:#e6e4df;--mut:#a4a7ab;--line:#383a3e;--acc:#2f7a5c;--acc-d:#286c51;--acc-ink:#fff;--fg-acc:#74c3a0;--acc-soft:#25382f;--warn:#ec9a84;--warn-soft:#3b2824;--bubble:#2f3134;--hover:#2b2d30;--sel:#303337;--field:#1a1b1d;--imgbg:#17181a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#202124;--side:#1a1b1d;--card:#2a2c2f;--soft:#27292c;--ink:#e6e4df;--mut:#a4a7ab;--line:#383a3e;--acc:#2f7a5c;--acc-d:#286c51;--acc-ink:#fff;--fg-acc:#74c3a0;--acc-soft:#25382f;--warn:#ec9a84;--warn-soft:#3b2824;--bubble:#2f3134;--hover:#2b2d30;--sel:#303337;--field:#1a1b1d;--imgbg:#17181a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
::placeholder{color:var(--mut);opacity:1}
:focus-visible{outline:2px solid var(--fg-acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:flex;height:100vh;height:100dvh;min-width:0;overflow:hidden}
/* sidebar */
#side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:600;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;flex:none}
#biz{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 8px 6px;font-weight:600}
#nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.agent{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer;min-width:0}
.agent:hover{background:var(--hover)}.agent[aria-current=true]{background:var(--sel)}
.agent:disabled{opacity:.5;cursor:default}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none;font-size:13px;font-weight:600}
.av.sp{background:transparent;color:var(--fg-acc);border:1.5px solid var(--fg-acc)}
.who{min-width:0;flex:1}.who b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:none}
.dot.work{display:block;background:transparent;border:2px solid var(--fg-acc);border-top-color:transparent;animation:sp 1s linear infinite}
.dot.new{display:block;background:var(--fg-acc)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.work{animation:none;background:var(--fg-acc)}}
/* stage */
#stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);min-height:62px}
#head h1{margin:0;font-size:15px;font-weight:600;line-height:1.3}#sub{font-size:13px;color:var(--mut)}
#head>div:first-child{min-width:0}#title,#sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuwrap{position:relative;flex:none}
#menu-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;font-size:20px;line-height:1}
#menu-btn:hover,#menu-btn[aria-expanded=true]{background:var(--bubble)}
#menu{position:absolute;right:0;top:44px;z-index:20;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px var(--shadow);padding:6px}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14px}
#menu button:hover,#menu button:focus-visible{background:var(--bubble)}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
#banner{padding:0 24px}
.bn{margin:10px 0 0;padding:9px 12px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-size:13px;white-space:pre-wrap}
.bn.info{border-color:var(--line);background:var(--soft);color:var(--mut)}
#log{flex:1;overflow-y:auto;padding:22px 24px 8px;min-height:0}
.col{max-width:760px;margin:0 auto}
.row{display:flex;gap:14px;margin:0 0 20px;align-items:flex-start}
.row .av{width:30px;height:30px;font-size:12px;margin-top:2px}
.row.user{justify-content:flex-end}
.bub{background:var(--bubble);border-radius:18px;padding:10px 16px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.bot{min-width:0;flex:1;max-width:100%;word-break:break-word}.bot p{margin:0 0 8px}.bot p:last-child{margin-bottom:0}.bot ul{margin:4px 0 8px;padding-left:20px}
.bot code,.card code{background:var(--bubble);padding:1px 5px;border-radius:5px;font-size:13px}
.bot.err{color:var(--warn)}
.mut{color:var(--mut);font-size:13px}
details.steps{margin-top:8px;font-size:13px;color:var(--mut)}details.steps summary{cursor:pointer}
.st-error{color:var(--warn)}
/* surfaces: informational blocks are plain tinted areas, only forms keep an outline */
.card{background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card.soft{background:var(--soft);border-color:transparent}
.card h3{margin:0 0 6px;font-size:14px}
.card dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.card dt{color:var(--mut)}.card dd{margin:0;word-break:break-word}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}.btn:hover{background:var(--acc-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--bubble)}
input[type=text],input:not([type]),textarea.f{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.q label.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;margin:2px 0;border-radius:10px;cursor:pointer}
.q label.opt:hover{background:var(--hover)}
.q label.opt:has(input:checked){background:var(--acc-soft)}
.q input[type=radio]{margin-top:4px;accent-color:var(--acc)}
.q .k{font-size:12px;color:var(--mut);margin-bottom:2px}
.err{color:var(--warn);font-size:13px;margin-top:8px;white-space:pre-wrap}
.created{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.intro{margin:0 0 22px}.intro>details>summary{cursor:pointer;font-size:13px;color:var(--mut)}.intro>details>summary b{color:var(--ink)}
.intro .lead{margin:8px 0 4px}.intro .caps{margin:0 0 6px}
.intro details.more{margin-top:4px;font-size:13px;color:var(--mut)}.intro details.more summary{cursor:pointer}
/* composer */
#composer{padding:6px 24px 16px}
#composer .col{position:relative}
#custbar{margin:0 0 8px;padding:8px 12px;border:1px solid var(--fg-acc);background:var(--acc-soft);color:var(--fg-acc);border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
#custbar[hidden]{display:none}
#custbar button{background:var(--field);border:1px solid var(--fg-acc);color:var(--fg-acc);border-radius:8px;padding:4px 12px;cursor:pointer;flex:none}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:0 2px 10px var(--shadow)}
.box.cust{border-color:var(--fg-acc);box-shadow:0 0 0 2px var(--acc-soft)}
#msg{flex:1;border:0;outline:0;resize:none;background:none;padding:6px 0;max-height:150px;min-height:28px;line-height:1.45;color:var(--ink)}
#send{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);cursor:pointer;display:grid;place-items:center;flex:none}
#send:disabled{background:var(--hover);color:var(--mut);cursor:default}
#send svg{width:18px;height:18px}
.box:focus-within{border-color:var(--fg-acc)}
#composer .hint{font-size:12px;color:var(--mut);margin:6px 4px 0;min-height:18px}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:16px}
.db{padding:16px 20px 20px;overflow:auto;max-height:calc(100vh - 140px)}
.db label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.db textarea.f{min-height:56px;resize:vertical;font:inherit}
.db details{margin-top:14px;font-size:13px;color:var(--mut)}
.fly{margin:0 0 14px}.fly img{max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:8px;display:block;background:var(--imgbg)}
.fly a{display:block;background:var(--imgbg);border-radius:10px}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px 6px}
  .brand{padding:0 4px 6px}.sec{display:none}
  #nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding-bottom:4px}
  .agent{width:auto;flex:none;padding:5px 12px 5px 6px;border:1px solid var(--line);background:var(--card);max-width:230px}
  .agent[aria-current=true]{border-color:var(--fg-acc);background:var(--acc-soft)}
  .agent .who span{display:none}.av{width:28px;height:28px}
  #head{padding:8px 14px;min-height:52px}#banner{padding:0 14px}#log{padding:14px 14px 4px}#composer{padding:4px 14px 10px}
  .bub{max-width:92%}.row{gap:10px}
  #menu{position:fixed;right:12px;left:12px;top:112px}
}
</style></head><body>
<div id="app">
<aside id="side" aria-label="Agents">
  <div class="brand"><span class="logo" aria-hidden="true">W</span><span id="biz">Agent workspace</span></div>
  <div class="sec" id="nav-label">Assistants</div>
  <nav id="nav" aria-labelledby="nav-label"></nav>
</aside>
<main id="stage">
  <header id="head">
    <div><h1 id="title">Main agent</h1><div id="sub"></div></div>
    <div class="menuwrap"><button id="menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Options for this chat">&#8943;</button><div id="menu" role="menu" hidden></div></div>
  </header>
  <div id="banner"></div>
  <div id="log" tabindex="0" aria-label="Conversation"></div>
  <form id="composer" autocomplete="off">
    <div class="col">
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="custbar" hidden><span id="custtext"><b>Customize is on for your next message only.</b> It may change this specialist's objective, instructions, skills and optional tools. Its identity, history and memory stay.</span><button type="button" id="custcancel">Cancel</button></div>
      <div class="box" id="box"><label class="sr" for="msg">Message</label><textarea id="msg" rows="1" placeholder="Ask anything about your business…"></textarea><button id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button></div>
      <div class="hint" id="hint">Enter sends, Shift+Enter adds a line.</div>
    </div>
  </form>
</main>
</div>
<div id="srlive" class="sr" role="status" aria-live="polite"></div>
<dialog id="dlg-biz" aria-labelledby="dlg-biz-t"><div class="dh"><h2 id="dlg-biz-t">Business details</h2><button class="btn ghost" type="button" data-close>Close</button></div><div class="db" id="biz-body"></div></dialog>
<dialog id="dlg-fly" aria-labelledby="dlg-fly-t"><div class="dh"><h2 id="dlg-fly-t">Saved flyers</h2><button class="btn ghost" type="button" data-close>Close</button></div><div class="db" id="fly-body"></div></dialog>
<script>
let stateReady=false,cur='main',TIMING=false,selSeq=0,agentsCache=[],offline=false,custArmed=false,COMPANY=null,PROBLEM='';const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
// Per-agent client state. A response only ever touches the state of the agent it was sent to.
const T={},remote={},AG={};
const S=id=>T[id]||(T[id]={rows:null,sending:null,draft:'',err:null,unread:false,lastText:'',lastRid:null});
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status+' from '+u);return r.json()};
const busy=id=>!!(S(id).sending||remote[id]);
const ROLE={market_analysis:'Market analyst',social_media:'Social-media specialist'};
const roleName=r=>ROLE[r]||String(r||'Specialist').replace(/_/g,' ');
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
// Plain-language capabilities: one phrase per group of granted tools (the backend decides what is granted; this only describes it).
const CAPS=[['Research Marketplace listings',['marketplace_locate','marketplace_search','marketplace_item','marketplace_photo']],['Use recorded sample listings',['read_recorded_evidence']],
 ['Write listing drafts',['save_listing_draft']],['Look at product and competitor photos',['inspect_image']],['Read your catalogue',['read_catalogue']],
 ['Research Facebook image ads',['fb_ads_find_advertiser','fb_ads_search','fb_ad_detail','fb_ad_image','save_ad_research','read_ad_research']],
 ['Generate a flyer from your photos',['generate_flyer']],['Check flyers and pick one',['inspect_flyer','review_flyer','finalize_flyer','read_flyer']]];
const capsOf=tools=>CAPS.filter(([,t])=>t.some(x=>tools.includes(x))).map(([l])=>l);
const CTX={products:'Products',customers:'Customers',goal:'Goal',brand:'Brand tone',competitors:'Known competitors',website:'Website'};

async function init(){
  try{
    const s=await j('/api/status');TIMING=!!s.timing;PROBLEM=s.problem||'';
    await loadCompany();await loadOnboarding();
  }catch{offline=true}
  paintBanner();poll();await select('main');   // the composer stays closed (stateReady) until the first busy-state lookup succeeds, however slow or failed it is
  setInterval(poll,2000);setInterval(tickWorking,1000);
}
function paintBanner(){
  $('banner').innerHTML=(offline?'<div class="bn">The app is not reachable right now. Your drafts are kept here, and this page refreshes by itself when it is back.</div>':'')+
    (PROBLEM?`<div class="bn">The AI provider is not ready: ${esc(PROBLEM)} Messages return this error until it is fixed.</div>`:'');
}

// ---- onboarding (backend-owned state; this only displays it and posts the explicit onboarding operations)
let ONB=null,onbBusy=false,onbErr='',onbUrl='',onbDraft={a:{},corr:''};   // onbDraft: what the operator typed, kept across every re-render of the question cards
const onbBlocked=()=>!!ONB&&!ONB.chat_unlocked;
async function loadOnboarding(){try{ONB=await j('/api/onboarding')}catch{return}if(cur==='main'||onbBlocked())render();paintSidebar();paintComposer()}
async function onbPost(path,body){
  let r;try{const x=await fetch('/api/onboarding/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});r=await x.json().catch(()=>null)}
  catch{r={ok:false,error:'The connection to the app was lost, so it is unknown whether this finished. The page reloads the saved state; nothing is repeated automatically.'}}
  return r||{ok:false,error:'The app answered without details.'};
}
function snapDraft(){
  if(!ONB||ONB.state!=='awaiting_answers'||!$('onb-corr'))return;
  onbDraft.corr=$('onb-corr').value;
  ONB.questions.forEach(q=>{const w=document.querySelector(`[data-w="${q.id}"]`),c=document.querySelector(`input[name="${q.id}"]:checked`);if(w)onbDraft.a[q.id]={w:w.value,c:c?c.value:''}});
  const u=$('onb-url');if(u)onbUrl=u.value;
}
function restoreDraft(el){
  $('onb-corr').value=onbDraft.corr;
  ONB.questions.forEach(q=>{const d=onbDraft.a[q.id];if(!d)return;el.querySelector(`[data-w="${q.id}"]`).value=d.w;const r=d.c===''?null:el.querySelector(`input[name="${q.id}"][value="${d.c}"]`);if(r)r.checked=true});
}
const bot=(html,cls='')=>`<div class="row"><span class="av" aria-hidden="true">M</span><div class="bot ${cls}">${html}</div></div>`;
const usr=t=>`<div class="row user"><div class="bub">${esc(t)}</div></div>`;
function renderOnboarding(){
  const o=ONB,log=$('log');if(onbBusy)return;snapDraft();
  let h=bot(`<p><b>Let's set up your business first.</b></p><p>I will read a prepared demo website snapshot, ask five short questions and save your answers as the business context. Chat unlocks when you finish.</p><p class="mut">${esc(o.notice)}</p>`);
  if(o.state==='not_started')h+=`<div class="card"><button class="btn" id="onb-start" type="button">Start onboarding</button><div class="err" role="alert">${esc(onbErr)}</div></div>`;
  else if(o.state==='awaiting_source')h+=`<div class="card"><h3><label for="onb-url">Website link</label></h3><div class="mut">Only the prepared demo site is available: <code>${esc(o.registered_url)}</code></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input type="text" id="onb-url" placeholder="${esc(o.registered_url)}" value="${esc(onbUrl)}" style="flex:1;min-width:180px"><button class="btn" id="onb-src" type="button">Read the site</button></div>
      <div class="err" id="onb-err" role="alert">${esc(onbErr||o.error||'')}</div></div>`;
  else if(o.state==='awaiting_answers'){
    h+=usr(o.url||o.registered_url)+bot(`<p><b>Here is what I understood from the snapshot.</b></p><p>${esc(o.summary)}</p>`)+
      `<div class="card"><h3><label for="onb-corr">Anything wrong or missing in this summary? (optional)</label></h3><input type="text" id="onb-corr" maxlength="600"></div>`+
      o.questions.map((q,n)=>`<div class="card q"><div class="k">Question ${n+1} of ${o.questions.length}</div><h3 id="q-${q.id}">${esc(q.question)}</h3><div role="radiogroup" aria-labelledby="q-${q.id}">`+
        q.options.map((t,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${i}"><span>${esc(t)}</span></label>`).join('')+
        `</div><label class="k" for="w-${q.id}" style="display:block;margin-top:8px">Or write your own answer</label><input type="text" id="w-${q.id}" data-w="${q.id}" maxlength="400"></div>`).join('')+
      `<div class="card"><button class="btn" id="onb-ans" type="button">Save answers and unlock chat</button><div class="err" id="onb-err" role="alert">${esc(onbErr)}</div></div>`;
  }else h+=`<div class="card mut">Onboarding is in progress. Chat unlocks when it is complete.</div>`;
  log.innerHTML='<div class="col">'+h+'</div>';
  const b=(id,f)=>{const e=$(id);if(e)e.onclick=f};b('onb-start',startOnboarding);b('onb-src',submitSource);b('onb-ans',submitAnswers);
  if(o.state==='awaiting_answers'){log.querySelectorAll('[data-w]').forEach(i=>i.addEventListener('input',()=>{if(i.value.trim())log.querySelectorAll(`input[name="${i.dataset.w}"]`).forEach(r=>{r.checked=false})}));restoreDraft(log)}
  const u=$('onb-url');if(u)u.addEventListener('input',()=>{onbUrl=u.value});
}
async function startOnboarding(){if(onbBusy)return;onbBusy=true;const sb=$('onb-start');if(sb)sb.disabled=true;const r=await onbPost('start');onbBusy=false;onbErr=r.ok?'':r.error;await loadOnboarding()}
async function submitSource(){
  if(onbBusy)return;const url=$('onb-url').value.trim();onbUrl=url;onbErr='';$('onb-err').textContent='';onbBusy=true;$('onb-src').disabled=true;$('onb-src').textContent='Reading… (up to a minute)';
  const r=await onbPost('source',{url});onbBusy=false;
  if(!r.ok)onbErr=r.error+(r.retryable?'\nNothing was saved. You can submit the link again.':'');
  await loadOnboarding();
}
async function submitAnswers(){
  if(onbBusy)return;const answers={};let missing=0;
  ONB.questions.forEach(q=>{const w=document.querySelector(`[data-w="${q.id}"]`).value.trim(),c=document.querySelector(`input[name="${q.id}"]:checked`);
    if(w)answers[q.id]={write_in:w};else if(c)answers[q.id]={choice:Number(c.value)};else missing++});
  if(missing){onbErr='Please answer every question (pick an option or write your own).';$('onb-err').textContent=onbErr;return}
  onbErr='';$('onb-err').textContent='';onbBusy=true;$('onb-ans').disabled=true;$('onb-ans').textContent='Saving… (up to a minute)';
  const r=await onbPost('answers',{answers,correction:$('onb-corr').value.trim()});onbBusy=false;
  if(!r.ok)onbErr=r.error+(r.retryable?'\nNothing was unlocked. You can submit again.':'');
  await loadOnboarding();
  if(ONB&&ONB.state==='ready'){await loadCompany(true);await select('main');$('msg').focus()}
}

// ---- business details (existing company form, in a dialog)
const FIELDS=[['name','Company name',0],['products','Products or product categories',1],['customers','Target customers',1],['goal','Business goal (what your specialists should help with)',1],['website','Website (optional)',0],['brand','Brand guidance (optional)',1],['competitors','Known competitors (optional)',1]];
let companyDirty=false;
async function loadCompany(force){
  if(companyDirty&&!force)return;   // never overwrite what the user is typing
  const c=await j('/api/company');COMPANY=c;$('biz').textContent=c.company.name||'Agent workspace';
  if($('dlg-biz').open||force)paintBiz();
  if(cur!=='main')paintIntroIfOpen();
}
function paintBiz(){
  if(!COMPANY)return;const c=COMPANY,st=c.status;
  $('biz-body').innerHTML=(st.complete?'<div class="mut">Details are complete. Specialists read the current details; edits do not rewrite their saved instructions.</div>'
      :`<div class="bn">Still needed: ${esc(st.missing_labels.join(', '))}. Fill this in, or just tell the main agent in chat.</div>`)+
    FIELDS.map(([k,l,ml])=>`<label for="cf-${k}">${l}${st.required.includes(k)?' *':''}</label>${ml?`<textarea class="f" id="cf-${k}" data-f="${k}">${esc(c.company[k])}</textarea>`:`<input id="cf-${k}" data-f="${k}" value="${esc(c.company[k])}">`}`).join('')+
    `<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="company-save" type="button">Save details</button><button class="btn ghost" id="company-discard" type="button" disabled>Discard changes</button><span id="company-msg" class="mut" role="status"></span></div>`+
    (ONB&&ONB.state==='ready'?'<details><summary>Where each saved field came from</summary>'+Object.entries(ONB.provenance).map(([k,v])=>`<div class="mut">${esc(k)}: ${esc(v)}</div>`).join('')+(ONB.correction?`<div class="mut">Your correction: ${esc(ONB.correction)}</div>`:'')+'</details>':'');
  companyDirty=false;
  $('biz-body').querySelectorAll('[data-f]').forEach(e=>e.addEventListener('input',()=>{companyDirty=true;$('company-discard').disabled=false}));
  $('company-save').addEventListener('click',saveCompany);if(onbBlocked())$('company-save').disabled=true;
  $('company-discard').addEventListener('click',()=>{companyDirty=false;paintBiz();$('company-msg').textContent='Changes discarded.'});
}
async function saveCompany(){
  const f={};$('biz-body').querySelectorAll('[data-f]').forEach(e=>{f[e.dataset.f]=e.value});
  let r;try{const x=await fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})});r=await x.json()}
  catch(e){$('company-msg').textContent='Could not reach the app: '+e.message;return}
  if(!r.ok){$('company-msg').textContent=r.error;return}
  companyDirty=false;const changed=r.changed.length;await loadCompany(true);$('company-msg').textContent=changed?'Saved.':'No changes.';
}

// ---- agents
async function refresh(){
  try{agentsCache=await j('/api/agents')}catch{/* keep the previous list when the request fails */}
  paintSidebar();
}
function stateOf(id){return busy(id)?['work','Working']:S(id).unread?['new','New reply']:['','']}
let navHtml='';
function paintSidebar(){
  const blocked=onbBlocked();
  const item=(id,name,sub,main)=>{const [c,t]=stateOf(id);return `<button type="button" class="agent" data-id="${esc(id)}" ${id===cur?'aria-current="true"':''} ${blocked&&id!=='main'?'disabled':''}><span class="av ${main?'':'sp'}" aria-hidden="true">${main?'M':esc(initials(name))}</span><span class="who"><b>${esc(name)}</b><span>${esc(sub)}</span></span><span class="dot ${c}" aria-hidden="true"></span>${t?`<span class="sr">${t}</span>`:''}</button>`};
  const html=item('main','Main agent','Creates your specialists',true)+agentsCache.map(a=>item(a.agent_id,a.name,roleName(a.role),false)).join(''),nav=$('nav');
  if(html===navHtml)return;   // nothing changed: keep the nodes, so a focused agent button keeps its keyboard focus
  const f=document.activeElement,fid=nav.contains(f)?f.dataset.id:null,sl=nav.scrollLeft,st=nav.scrollTop;   // focus counts only when it was inside the list: an update never takes it from anywhere else
  navHtml=html;nav.innerHTML=html;nav.scrollLeft=sl;nav.scrollTop=st;
  nav.querySelectorAll('.agent').forEach(b=>b.onclick=()=>select(b.dataset.id));
  if(fid){const b=[...nav.querySelectorAll('.agent')].find(x=>x.dataset.id===fid);if(b&&!b.disabled)b.focus()}
}
async function poll(){   // who is working (server-side truth); also notices turns that finish while this page is not waiting on them
  let st;try{st=await j('/api/state')}catch{if(!offline){offline=true;paintBanner()}Object.keys(remote).forEach(k=>delete remote[k]);paintSidebar();paintComposer();const w=document.getElementById('working');if(w&&!S(cur).sending)w.remove();return}
  if(offline){offline=false;paintBanner();await loadRows(cur);await loadOnboarding();await refresh()}
  const was={...remote};Object.keys(remote).forEach(k=>delete remote[k]);Object.entries(st).forEach(([k,v])=>{if(v.busy)remote[k]=v});stateReady=true;   // the first successful lookup of who is working opens sending
  let ended=false;
  for(const id of Object.keys(was)){if(!remote[id]&&!S(id).sending){ended=true;await loadRows(id);if(id!==cur){S(id).unread=true}else $('srlive').textContent='New reply'}}
  if(ended)await refresh();
  paintSidebar();paintComposer();if(!S(cur).sending)paintWorking();
}
async function select(id){
  const my=++selSeq;if(!onbBlocked())S(cur).draft=$('msg').value;cur=id;S(id).unread=false;custArmed=false;
  $('msg').value=onbBlocked()?'':S(id).draft;autosize();
  const a0=agentsCache.find(x=>x.agent_id===id);
  $('title').textContent=id==='main'?'Main agent':(a0?a0.name:'Specialist');$('sub').textContent=id==='main'?'Creates specialists and keeps your business context':(a0?roleName(a0.role):'');
  await refresh();render();
  if(id!=='main'){try{const a=await j('/api/agents/'+id);if(my!==selSeq)return;AG[id]=a;$('title').textContent=a.name;$('sub').textContent=roleName(a.role);render()}
    catch(e){if(my===selSeq)S(id).err={kind:'error',text:'Could not load this specialist: '+e.message};paintNotice()}}
  if(!S(id).sending)await loadRows(id);   // while a request of ours is in flight the local view is authoritative
  if(my===selSeq)$('log').scrollTop=1e9;
}
async function loadRows(id){
  try{S(id).rows=await j('/api/chat/'+id);if(S(id).err&&S(id).err.kind==='load')S(id).err=null}
  catch(e){if(!S(id).err)S(id).err={kind:'load',text:'Could not load the conversation: '+e.message}}
  if(id===cur)render();
}

// ---- conversation rendering
function fmt(t){   // tiny safe formatter: escape first, then **bold**, `code`, "- " bullets; no links, no raw HTML
  const lines=esc(t).split('\n');let out='',list=false;
  const f=s=>s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const l of lines){const m=/^\s*[-*]\s+(.*)$/.exec(l),h=/^#{1,4}\s+(.*)$/.exec(l);
    if(m){if(!list){out+='<ul>';list=true}out+='<li>'+f(m[1])+'</li>'}else{if(list){out+='</ul>';list=false}if(h)out+='<p><b>'+f(h[1])+'</b></p>';else if(l.trim())out+='<p>'+f(l)+'</p>'}}
  return out+(list?'</ul>':'');
}
function createdChip(m){   // main's own stored create_agent result (backend-written activity of that message), shown only while that specialist really exists
  if(cur!=='main'||!m.activity)return '';
  for(const a of m.activity){if(a.tool!=='create_agent'||a.status!=='ok')continue;let o;try{o=JSON.parse(a.output||'')}catch{continue}
    const ag=o&&o.ok&&agentsCache.find(x=>x.agent_id===o.agent_id);
    if(ag)return `<div class="card soft created"><div><b>${esc(ag.name)}</b> was created<div class="mut">${esc(roleName(ag.role))}</div></div><button class="btn" type="button" data-open="${esc(ag.agent_id)}">Open chat</button></div>`}
  return '';
}
function msgHTML(m){
  if(m.who==='user')return usr(m.content);
  const err=m.who==='error',text=err?String(m.content).replace(/^\[error\]\s*/,''):m.content;
  const steps=m.activity&&m.activity.length?`<details class="steps"><summary>What it did (${m.activity.length})</summary>`+m.activity.map(a=>`<div>${esc(a.label)}${a.status==='error'?' <span class="st-error">(failed)</span>':''}</div>`).join('')+'</details>':'';
  return `<div class="row"><span class="av ${cur==='main'?'':'sp'}" aria-hidden="true">${cur==='main'?'M':esc(initials((AG[cur]||{}).name))}</span><div class="bot ${err?'err':''}">${err?'<p><b>That did not work.</b></p>':''}${fmt(text)}${steps}${createdChip(m)}</div></div>`;
}
function onboardedCard(empty){   // shown at the top of main's conversation once onboarding is saved (state comes from the backend, so it survives reload)
  if(!ONB||ONB.state!=='ready')return '';
  const roles=ONB.roles.map(r=>`<li><b>${esc(r.name)}</b> - ${esc(r.what)}</li>`).join('');
  return bot(`<p><b>Your business is set up.</b> I saved the prepared snapshot and your answers as the business context.</p><details ${empty?'open':''}><summary>Which specialists fit</summary><ul>${roles}</ul><p class="mut">${esc(ONB.roles_note)}</p></details>`);
}
function introHTML(id,open){   // the specialist's stored, business-specific purpose; no model call is made for it
  const a=AG[id];if(!a)return '';
  const refs=(a.context_refs||[]).filter(k=>CTX[k]),co=COMPANY?COMPANY.company:{};
  const ctx=refs.filter(k=>co[k]).map(k=>`<dt>${esc(CTX[k])}</dt><dd>${esc(String(co[k]).slice(0,180))}</dd>`).join('');
  const caps=capsOf(a.granted_tools||[]),full=String(a.objective||''),first=(full.match(/^.*?[.!?](?=\s|$)/)||[full])[0],lead=first.length>170?first.slice(0,167)+'…':first;
  return `<div class="intro" id="intro"><details ${open?'open':''}><summary><b>About this specialist</b> - ${esc(roleName(a.role))}</summary><p class="lead">${esc(lead)}</p>${caps.length?`<p class="mut caps">Can: ${caps.map(esc).join(' · ')}</p>`:''}
    <details class="more"><summary>Business context and limits</summary>${full.length>lead.length?`<p>${esc(full)}</p>`:''}${ctx?`<dl>${ctx}</dl>`:''}<p>It never posts or sends anything. It keeps its own notes, and only you can change its setup (menu, Customize).</p></details></details></div>`;
}
function paintIntroIfOpen(){const d=document.querySelector('#intro>details');if(d&&cur!=='main'){const o=d.open;const t=document.createElement('div');t.innerHTML=introHTML(cur,o);d.closest('#intro').replaceWith(t.firstElementChild)}}
function render(){   // draws ONLY the current agent's state
  const st=S(cur),log=$('log');
  if(onbBlocked()){renderOnboarding();paintNotice();paintComposer();return}
  const rows=st.rows||[];let h='';
  if(cur==='main'){h+=onboardedCard(!rows.length&&!st.sending);if(!rows.length&&!st.sending&&(!ONB||ONB.state!=='ready'))h+=bot('<p>Hello. Ask me about your business, or ask me to set up a specialist for the work you need.</p>')}
  else h+=introHTML(cur,!rows.length&&!st.sending);
  h+=rows.map(msgHTML).join('');
  if(st.sending)h+=usr(st.sending.text);
  log.innerHTML='<div class="col">'+h+'</div><div class="col" id="workslot"></div>';
  log.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>select(b.dataset.open));
  paintWorking();paintNotice();paintComposer();log.scrollTop=1e9;
}
function paintWorking(){
  const slot=$('workslot'),old=document.getElementById('working');if(old)old.remove();
  if(!slot||!busy(cur)||onbBlocked())return;
  const st=S(cur),since=st.sending?st.sending.t0:(remote[cur]?remote[cur].since*1000:Date.now());
  const d=document.createElement('div');d.className='row';d.id='working';d.dataset.since=since;d.dataset.lead=st.sending?'Working… ':'This agent is already working on a request (started before this page loaded)… ';
  d.innerHTML=`<span class="av ${cur==='main'?'':'sp'}" aria-hidden="true">${cur==='main'?'M':esc(initials((AG[cur]||{}).name))}</span><div class="bot mut" aria-live="off"></div>`;
  slot.appendChild(d);tickWorking();$('log').scrollTop=1e9;
}
function tickWorking(){const w=document.getElementById('working');if(w)w.lastChild.textContent=w.dataset.lead+Math.max(0,Math.round((Date.now()-w.dataset.since)/1000))+'s'}
function paintNotice(){const e=S(cur).err;$('notice').innerHTML=e?`<div class="bn ${e.kind==='info'?'info':''}">${esc(e.text)}</div>`:''}
function autosize(){const m=$('msg');m.style.height='auto';m.style.height=Math.min(m.scrollHeight,150)+'px'}
function paintComposer(){
  const blocked=onbBlocked(),b=busy(cur),isCust=custArmed&&cur!=='main';
  const wait=!stateReady;
  $('send').disabled=b||blocked||wait;$('send').setAttribute('aria-label',b?'Working, sending is paused':wait?'Send message (waiting for the app)':'Send message');
  $('msg').disabled=blocked;$('msg').placeholder=blocked?'Chat unlocks when onboarding is finished':isCust?'Describe the change you want to make to this specialist…':cur==='main'?'Ask anything about your business…':'Message this specialist…';
  $('custbar').hidden=!isCust;$('box').classList.toggle('cust',isCust);
  $('hint').textContent=blocked?'Finish the onboarding questions above to unlock chat.':wait?(offline?'Waiting for the app to answer before sending is possible.':'Checking whether any agent is already working…'):b?'This agent is working. You can switch to another agent meanwhile.':'Enter sends, Shift+Enter adds a line.';
}

// ---- theme: follows the system setting until the operator chooses; the choice is remembered in this browser only
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const chosenTheme=()=>{try{const t=localStorage.getItem('ui-theme');return t==='dark'||t==='light'?t:null}catch{return null}};
const effTheme=()=>chosenTheme()||(sysDark()?'dark':'light');
function setTheme(t){
  try{if(t)localStorage.setItem('ui-theme',t);else localStorage.removeItem('ui-theme')}catch{/* storage unavailable: the choice then lasts for this page only */}
  if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
}
// ---- menu (existing business details, saved flyers, Customize, theme)
const menu=$('menu'),mbtn=$('menu-btn');
function menuItems(){
  const it=[];
  if(!onbBlocked()){
    if(cur!=='main'){it.push(['Customize this specialist…',()=>{custArmed=true;paintComposer();$('msg').focus()}]);it.push(['About this specialist',()=>{const d=document.querySelector('#intro>details');if(d){d.open=true;d.scrollIntoView({block:'nearest'});d.querySelector('summary').focus()}}])}
    it.push(['Saved flyers',()=>openFlyers()]);
  }
  it.push(['Business details',()=>{if(!companyDirty)paintBiz();$('dlg-biz').showModal();if(companyDirty)$('company-msg').textContent='Your unsaved edits are kept. Save them or choose Discard changes.'}]);
  if(ONB&&ONB.state==='not_started'&&!ONB.required&&cur==='main')it.push(['Set up business onboarding (optional)',async()=>{await startOnboarding();select('main')}]);
  it.push(null,[effTheme()==='dark'?'Switch to light mode':'Switch to dark mode',()=>setTheme(effTheme()==='dark'?'light':'dark')]);
  if(chosenTheme())it.push(['Use the system theme',()=>setTheme(null)]);
  return it;
}
function openMenu(){
  const it=menuItems();menu.innerHTML='';
  it.forEach(x=>{if(!x){menu.appendChild(document.createElement('hr'));return}const [l,f]=x;const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.textContent=l;b.onclick=()=>{closeMenu(false);f()};menu.appendChild(b)});
  menu.hidden=false;mbtn.setAttribute('aria-expanded','true');menu.querySelector('button').focus();
}
function closeMenu(refocus=true){menu.hidden=true;mbtn.setAttribute('aria-expanded','false');if(refocus)mbtn.focus()}
mbtn.onclick=()=>menu.hidden?openMenu():closeMenu();
menu.addEventListener('keydown',e=>{const b=[...menu.querySelectorAll('button')],i=b.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();closeMenu()}else if(e.key==='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus()}else if(e.key==='Tab')closeMenu(false)});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target!==mbtn)closeMenu(false)});
document.querySelectorAll('dialog [data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>mbtn.focus()));   // the item that opened a dialog is gone with the menu: return focus to the menu button
$('custcancel').onclick=()=>{custArmed=false;paintComposer();$('msg').focus()};

// ---- saved flyers (on demand; saved output stays reachable until it moves into the conversation)
async function openFlyers(){
  const body=$('fly-body');body.innerHTML='<div class="mut">Loading…</div>';$('dlg-fly').showModal();
  let f;try{f=await j('/api/flyers'+(cur==='main'?'':'?agent_id='+encodeURIComponent(cur)))}catch(e){body.innerHTML=`<div class="bn">Could not load the saved flyers: ${esc(e.message)}</div>`;return}
  if(!f.length){body.innerHTML='<div class="mut">No saved flyers yet.</div>';return}
  const LAB={unchecked:'Not reviewed',agent_review_passed:'Automated review passed (not human approval)',unresolved_issues:'Unresolved issues - unapproved draft',awaiting_selection:'Awaiting selection',storage_failure:'Storage or integrity failure',failed:'Generation failed',in_progress_or_unknown:'Outcome unknown'};
  body.innerHTML=f.map(x=>`<div class="card soft fly"><b>Generated flyer</b> <span class="mut">- ${esc(LAB[x.status]||x.status)}</span>`+
    (x.image?`<a href="${esc(x.image.url)}" target="_blank" rel="noopener"><img src="${esc(x.image.url)}" alt="Generated flyer, ${x.image.width} by ${x.image.height} pixels" loading="lazy"></a><div class="mut">${x.image.width}x${x.image.height}. Open the image to see it full size.</div>`:'')+
    (x.note?`<div class="mut">${esc(x.note)}</div>`:'')+
    (x.final&&x.final.rationale?`<div class="mut">Selection: ${esc(x.final.rationale)}</div>`:'')+
    (x.review?`<div class="mut">Review: ${esc(x.review.verdict)}${x.review.verified?'':' (pixels not confirmed delivered)'}</div>`:'')+
    (x.unresolved_issues&&x.unresolved_issues.length?'<div class="st-error">Known issues: '+x.unresolved_issues.map(i=>esc(i.check)+': '+esc(i.description)).join('; ')+'</div>':'')+
    (x.error?`<div class="st-error">${esc(x.error_kind||x.outcome||'error')}: ${esc(x.error)}</div>`:'')+
    (x.inputs_synthetic?'<div class="mut">Inputs were synthetic test stand-ins.</div>':'')+'</div>').join('');
}

// ---- sending
async function send(){
  const id=cur,st=S(id);
  if(!stateReady||busy(id)||onbBlocked())return;   // synchronous guard: Enter + click in the same tick, or key repeat, make ONE request
  const text=$('msg').value.trim();if(!text)return;
  const cust=id!=='main'&&custArmed;          // the operator's Customize mode applies to this one message
  const rid=(st.lastText===text&&st.lastRid)?st.lastRid:newId();   // same text after an unconfirmed failure keeps its id: the backend can then recognise a request that already completed
  st.sending={text,rid,t0:Date.now()};st.err=null;st.lastText=text;st.lastRid=rid;st.draft='';$('msg').value='';autosize();custArmed=false;
  render();paintSidebar();
  let status=0,data=null,net=null;
  try{const r=await fetch('/api/chat/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,request_id:rid,customize:cust})});
      status=r.status;data=await r.json().catch(()=>null)}catch(e){net=e}
  const t1=Date.now()-st.sending.t0;st.sending=null;delete remote[id];   // a stale poll result must not keep this agent 'working'
  const keep=(why)=>{st.err={kind:'error',text:why};st.draft=text;if(cur===id){$('msg').value=text;autosize()}};   // message preserved for an intentional retry
  if(net){keep('The connection to the app failed, so it is unknown whether this message arrived or finished (the agent may still be working, or may already be done). The conversation reloads when the connection is back. Your message is back in the box: check the conversation first, then press Send to retry. Retrying the same text is recognised if it already completed.')}
  else if(status===200&&data&&data.ok){st.lastText='';st.lastRid=null;if(data.replayed)st.err={kind:'info',text:'That request had already completed; showing its stored result (nothing was run again).'}}
  else if(status===200&&data){st.lastRid=null;keep('The turn failed: '+(data.error||'unknown error')+'\nYour message is back in the box. It may have partly run (see "What it did" in the conversation), so retry only if that is what you want.')}
  else if(data&&data.code==='duplicate_in_flight'){keep('That exact request is still running. Wait for it to finish; the conversation will update.')}
  else if(data&&data.code&&status>=500){keep(data.error+' Your message is back in the box; check the conversation before retrying.')}
  else if(data&&data.code){keep('Not sent: '+data.error+' Nothing was saved or run. Your message is back in the box.')}
  else{keep('The app answered HTTP '+status+' without details; the message may not have been recorded. Your message is back in the box; check the conversation before retrying.')}
  if(cust&&status===200&&data&&data.ok){try{AG[id]=await j('/api/agents/'+id)}catch{/* the introduction keeps its previous text until the next reload */}}   // show the applied configuration in the specialist's introduction
  if(cur!==id)st.unread=true;else if(data&&data.ok)$('srlive').textContent='New reply';
  await loadRows(id);await refresh();loadCompany().catch(()=>{});if(cur===id)render();
  if(TIMING){fetch('/api/timing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_roundtrip_ms:t1})}).catch(()=>{})}
}
$('composer').addEventListener('submit',e=>{e.preventDefault();send()});
$('msg').addEventListener('input',()=>{S(cur).draft=$('msg').value;autosize()});
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!e.repeat)send()}});
init();
