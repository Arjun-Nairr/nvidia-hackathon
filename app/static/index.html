<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent Team Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e2e0da;--acc:#2f5d50;--warn:#a4402a}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--card:#222220;--ink:#ecebe6;--mut:#a09f98;--line:#383834;--acc:#3f7a69;--warn:#e08a74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:300px 1fr 340px}
@media (max-width:900px){body{grid-template-columns:1fr;height:auto}#chat{height:80vh}}
aside,section{padding:16px;overflow:auto;border-right:1px solid var(--line)}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 8px}
h2:first-child{margin-top:0}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.agent{cursor:pointer}.agent.sel{border-color:var(--acc);outline:1px solid var(--acc)}.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.pill.running{color:var(--warn);border-color:var(--warn)}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.4 ui-monospace,monospace}
#chat{display:flex;flex-direction:column;height:100vh;padding:0}#log{flex:1;overflow:auto;padding:16px}#chatbar{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.m{max-width:85%;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}.m.user{margin-left:auto;background:var(--acc);color:#fff;border-color:var(--acc)}.m.error{border-color:var(--warn);color:var(--warn)}
details{font-size:12px;color:var(--mut);margin-top:6px}textarea{flex:1;resize:vertical;min-height:44px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;padding:8px 16px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}button:disabled{opacity:.5}
.banner{background:var(--warn);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}.mut{color:var(--mut);font-size:13px}
.notice{margin:0 16px 8px;padding:8px 12px;border-radius:8px;border:1px solid var(--warn);color:var(--warn);font-size:13px;white-space:pre-wrap}
.notice.info{border-color:var(--line);color:var(--mut)}.m.working{color:var(--mut);font-style:italic}.m details{margin-top:8px}.m .act-item{margin:4px 0 0 8px}
.st-error{color:var(--warn)}#company label{display:block;font-size:12px;color:var(--mut);margin-top:8px}#company input,#company textarea{width:100%;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}#company textarea{min-height:52px;resize:vertical}#company .need{color:var(--warn)}.pill.new{color:var(--acc);border-color:var(--acc)}
</style></head><body>
<aside>
  <div id="status"></div>
  <h2>Chat with</h2>
  <div class="card agent sel" id="a-main" onclick="select('main')"><b>Main agent</b> <span class="pill" id="pill-main"></span><br><span class="mut">creates specialists</span></div>
  <h2>Created agents</h2><div id="agents"><span class="mut">None yet. Ask the main agent to create one.</span></div>
  <h2>Company</h2><div id="company" class="card"></div>
</aside>
<section id="chat">
  <div style="padding:12px 16px;border-bottom:1px solid var(--line)"><b id="title">Main agent</b> <span class="mut" id="sub"></span></div>
  <div id="log"></div>
  <div id="notice"></div>
  <div id="chatbar"><textarea id="msg" placeholder="Message… (Enter sends, Shift+Enter newline)"></textarea><button id="send">Send</button></div>
</section>
<aside style="border-right:0" id="inspect"><h2>Inspector</h2><span class="mut">Select a specialist to inspect its generated instructions, tools and skill.</span></aside>
<script>
let cur='main',TIMING=false,selSeq=0,agentsCache=[],offline=false;const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
// Per-agent client state. A response only ever touches the state of the agent it was sent to.
const T={},remote={};
const S=id=>T[id]||(T[id]={rows:null,sending:null,draft:'',err:null,unread:false,lastText:'',lastRid:null});
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status+' from '+u);return r.json()};
const busy=id=>!!(S(id).sending||remote[id]);

async function init(){
  try{
    const s=await j('/api/status');TIMING=!!s.timing;
    $('status').innerHTML=(s.problem?`<div class="banner">${esc(s.problem)} Chat returns this error until fixed. Config: <code>${s.secrets_file}</code></div>`:'')+
     `<div class="mut">Provider: <b>${esc(s.provider||'not set')}</b><br>Model: <b>${esc(s.model||'not set')}</b><br>Auth: ${s.problem?'<b>not ready</b>':'ready'}<br>Research tools: <b>granted per specialist</b> (flyer generation: only for a specialist granted generate_flyer; posting: not connected)</div>`;
    await loadCompany();
  }catch(e){$('status').innerHTML=`<div class="banner">Cannot reach the app backend (${esc(e.message)}). Is run.bat still running?</div>`}
  await select('main');
  setInterval(poll,2000);setInterval(tickWorking,1000);
}
const FIELDS=[['name','Company name',0],['products','Products or product categories',1],['customers','Target customers',1],['goal','Business goal (what your specialists should help with)',1],['website','Website (optional)',0],['brand','Brand guidance (optional)',1],['competitors','Known competitors (optional)',1]];
let companyDirty=false;
async function loadCompany(force){
  if(companyDirty&&!force)return;   // never overwrite what the user is typing
  const c=await j('/api/company'),st=c.status;
  $('company').innerHTML=(st.complete?'<div class="mut">Details complete. Specialists read the current details; edits do not rewrite their saved instructions.</div>'
      :`<div class="mut need">Still needed: ${esc(st.missing_labels.join(', '))}. Fill this in, or just tell the main agent in chat.</div>`)+
    FIELDS.map(([k,l,ml])=>`<label>${l}${st.required.includes(k)?' *':''}</label>${ml?`<textarea data-f="${k}">${esc(c.company[k])}</textarea>`:`<input data-f="${k}" value="${esc(c.company[k])}">`}`).join('')+
    '<div style="margin-top:8px"><button id="company-save">Save company</button> <span id="company-msg" class="mut"></span></div>';
  companyDirty=false;
  $('company').querySelectorAll('[data-f]').forEach(e=>e.addEventListener('input',()=>{companyDirty=true}));
  $('company-save').addEventListener('click',saveCompany);
}
async function saveCompany(){
  const f={};$('company').querySelectorAll('[data-f]').forEach(e=>{f[e.dataset.f]=e.value});
  let r;try{const x=await fetch('/api/company',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})});r=await x.json()}
  catch(e){$('company-msg').textContent='Could not reach the app: '+e.message;return}
  if(!r.ok){$('company-msg').textContent=r.error;return}
  companyDirty=false;await loadCompany(true);$('company-msg').textContent=r.changed.length?'Saved.':'No changes.';
}
async function refresh(){
  try{agentsCache=await j('/api/agents')}catch{/* keep the previous list when the request fails */}
  paintSidebar();
}
function pillFor(id){return busy(id)?['running','working']:S(id).unread?['new','new reply']:['','idle']}
function paintSidebar(){
  const a=agentsCache;
  $('agents').innerHTML=a.length?a.map(x=>{const [c,t]=pillFor(x.agent_id);return `<div class="card agent" id="a-${x.agent_id}" onclick="select('${x.agent_id}')"><b>${esc(x.name)}</b> <span class="pill ${c}">${t}</span><br><span class="mut">${esc(x.role)} · ${esc(x.agent_id)}</span></div>`}).join(''):'<span class="mut">None yet. Ask the main agent to create one.</span>';
  const [c,t]=pillFor('main');$('pill-main').className='pill '+c;$('pill-main').textContent=t;
  document.querySelectorAll('.agent').forEach(e=>e.classList.toggle('sel',e.id==='a-'+cur));
}
async function poll(){   // who is working (server-side truth); also notices turns that finish while this page is not waiting on them
  let st;try{st=await j('/api/state')}catch{offline=true;Object.keys(remote).forEach(k=>delete remote[k]);paintSidebar();paintNotice();paintComposer();const w=document.getElementById('working');if(w&&!S(cur).sending)w.remove();return}
  if(offline){offline=false;await loadRows(cur);paintNotice()}
  const was={...remote};Object.keys(remote).forEach(k=>delete remote[k]);Object.entries(st).forEach(([k,v])=>{if(v.busy)remote[k]=v});
  let ended=false;
  for(const id of Object.keys(was)){if(!remote[id]&&!S(id).sending){ended=true;await loadRows(id);if(id!==cur)S(id).unread=true}}
  if(ended)await refresh();
  paintSidebar();paintComposer();if(!S(cur).sending)paintWorking();
}
async function select(id){
  const my=++selSeq;S(cur).draft=$('msg').value;cur=id;S(id).unread=false;$('msg').value=S(id).draft;
  $('title').textContent=id==='main'?'Main agent':'Specialist chat';$('sub').textContent=id;
  await refresh();render();
  if(id==='main'){$('inspect').innerHTML='<h2>Inspector</h2><span class="mut">Select a specialist to inspect it.</span>'}
  else{try{const a=await j('/api/agents/'+id);if(my!==selSeq)return;$('title').textContent=a.name;
    $('inspect').innerHTML=`<h2>Objective</h2><div class="card">${esc(a.objective)}</div><h2>Instructions</h2><div class="card"><pre>${esc(a.instructions)}</pre></div>
    <h2>Granted tools</h2><div class="card">${a.granted_tools.map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}<div class="mut">Company sections: ${a.context_refs.join(', ')}</div></div>
    <h2>Approval requirements</h2><div class="card">${a.approval_requirements.map(r=>`<div><b>${esc(r.action)}</b><br><span class="mut">${esc(r.requirement)}</span></div>`).join('<hr>')}</div>
    <h2>Skills</h2>${a.skills.map(s=>`<div class="card"><b>${esc(s.name)}</b><pre>${esc(s.content)}</pre></div>`).join('')}
    <h2>Conversation</h2><div class="card mut">${esc(a.conversation_id)} (Hermes session, profile ${esc(a.agent_id)})</div><div id="flyers"></div>`;
    await loadFlyers(id,my)}
    catch(e){$('inspect').innerHTML=`<h2>Inspector</h2><div class="notice">Could not load this agent: ${esc(e.message)}</div>`}}
  if(!S(id).sending)await loadRows(id);   // while a request of ours is in flight the local view is authoritative
  if(my===selSeq)$('log').scrollTop=1e9;
}
async function loadFlyers(id,my){   // saved flyers of this specialist, exactly as the backend stored them (status and errors are never reinterpreted)
  let f;try{f=await j('/api/flyers?agent_id='+encodeURIComponent(id))}catch{return}
  const el=$('flyers');if(!el||my!==selSeq||!f.length)return;
  const LAB={unchecked:'UNCHECKED',storage_failure:'STORAGE / INTEGRITY FAILURE',failed:'GENERATION FAILED',in_progress_or_unknown:'OUTCOME UNKNOWN'};
  el.innerHTML='<h2>Saved flyers</h2>'+f.map(x=>`<div class="card"><b class="${x.status==='unchecked'?'':'st-error'}">${esc(LAB[x.status]||x.status)}</b> <span class="mut">${esc(x.flyer_id)} · ${esc(x.product_id)}</span>`+
    (x.image?`<br><img src="${esc(x.image.url)}" alt="Saved flyer ${esc(x.flyer_id)}" style="max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:6px"><div class="mut">${x.image.width}x${x.image.height} · sha256 ${esc(x.image.sha256.slice(0,12))}…</div>`:'')+
    (x.note?`<div class="mut">${esc(x.note)}</div>`:'')+(x.error?`<div class="st-error">${esc(x.error_kind||x.outcome||'error')}: ${esc(x.error)}</div>`:'')+
    (x.inputs_synthetic?'<div class="mut">Inputs were synthetic test stand-ins.</div>':'')+'</div>').join('');
}
async function loadRows(id){
  try{S(id).rows=await j('/api/chat/'+id);if(S(id).err&&S(id).err.kind==='load')S(id).err=null}
  catch(e){if(!S(id).err)S(id).err={kind:'load',text:'Could not load the transcript: '+e.message}}
  if(id===cur)render();
}
function addMsg(m){
  const d=document.createElement('div');d.className='m '+(m.who==='user'?'user':m.who==='error'?'error':'');
  d.textContent=m.content;
  if(m.activity&&m.activity.length){
    const t=document.createElement('details');t.className='act';
    t.innerHTML='<summary>Activity: '+m.activity.map(a=>esc(a.label)+(a.status==='error'?' <span class="st-error">(failed)</span>':'')).join(' · ')+'</summary>'+
      m.activity.map(a=>`<div class="act-item"><b>${esc(a.label)}</b> — ${esc(a.status)}<details><summary>Raw details</summary><pre>${esc(JSON.stringify({tool:a.tool,input:a.input,output:a.output},null,1))}</pre></details></div>`).join('');
    d.appendChild(t);
  }
  if(m.route&&m.route.outcome){
    const t=document.createElement('details');t.className='act';const c=m.route.classifier||{};
    t.innerHTML='<summary>Routing: '+esc(m.route.outcome)+(m.route.handled_locally?' (handled without the agent model)':'')+(c.model_ms?' · '+Math.round(c.model_ms)+' ms':'')+'</summary><pre>'+esc(JSON.stringify(m.route,null,1))+'</pre>';
    d.appendChild(t);
  }
  $('log').appendChild(d);
}
function render(){   // draws ONLY the current agent's state
  const st=S(cur),log=$('log');log.innerHTML='';(st.rows||[]).forEach(addMsg);
  if(st.sending)addMsg({who:'user',content:st.sending.text});
  paintWorking();paintNotice();paintComposer();log.scrollTop=1e9;
}
function paintWorking(){
  const log=$('log'),old=document.getElementById('working');if(old)old.remove();
  const st=S(cur);if(!busy(cur))return;
  const since=st.sending?st.sending.t0:(remote[cur]?remote[cur].since*1000:Date.now());
  const d=document.createElement('div');d.className='m working';d.id='working';d.dataset.since=since;
  d.textContent=(st.sending?'Working… ':'This agent is working on a request (started before this page loaded)… ')+Math.max(0,Math.round((Date.now()-since)/1000))+'s';
  log.appendChild(d);
}
function tickWorking(){const w=document.getElementById('working');if(w)w.textContent=w.textContent.replace(/\d+s$/,Math.max(0,Math.round((Date.now()-w.dataset.since)/1000))+'s')}
function paintNotice(){const e=S(cur).err;$('notice').innerHTML=(offline?'<div class="notice">The app backend is not reachable right now. Status and transcript refresh automatically when it is back.</div>':'')+(e?`<div class="notice ${e.kind==='info'?'info':''}">${esc(e.text)}</div>`:'')}
function paintComposer(){const b=busy(cur);$('send').disabled=b;$('send').textContent=b?'Working…':'Send'}

async function send(){
  const id=cur,st=S(id);
  if(busy(id))return;                       // synchronous guard: Enter + click in the same tick, or key repeat, make ONE request
  const text=$('msg').value.trim();if(!text)return;
  const rid=(st.lastText===text&&st.lastRid)?st.lastRid:newId();   // same text after an unconfirmed failure keeps its id: the backend can then recognise a request that already completed
  st.sending={text,rid,t0:Date.now()};st.err=null;st.lastText=text;st.lastRid=rid;st.draft='';$('msg').value='';
  render();paintSidebar();
  let status=0,data=null,net=null;
  try{const r=await fetch('/api/chat/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,request_id:rid})});
      status=r.status;data=await r.json().catch(()=>null)}catch(e){net=e}
  const t1=Date.now()-st.sending.t0;st.sending=null;delete remote[id];   // a stale poll result must not keep this agent 'working'
  const keep=(why)=>{st.err={kind:'error',text:why};st.draft=text;if(cur===id)$('msg').value=text};   // message preserved for an intentional retry
  if(net){keep('Connection to the app failed, so it is UNKNOWN whether this message was received or finished (the agent may still be working or may already be done). The transcript reloads when the connection is back. Your message is back in the box: check the transcript first, then press Send to retry. Retrying the same text is recognised by the backend if it already completed.')}
  else if(status===200&&data&&data.ok){st.lastText='';st.lastRid=null;if(data.replayed)st.err={kind:'info',text:'That request had already completed; showing its stored result (nothing was run again).'}}
  else if(status===200&&data){st.lastRid=null;keep('The turn failed: '+(data.error||'unknown error')+'\nYour message is back in the box. It may have partly run (see its Activity in the transcript), so retry only if that is what you want.')}
  else if(data&&data.code==='duplicate_in_flight'){keep('That exact request is still running on the backend. Wait for it to finish; the transcript will update.')}
  else if(data&&data.code&&status>=500){keep(data.error+' Your message is back in the box; check the transcript before retrying.')}
  else if(data&&data.code){keep('Not sent: '+data.error+' The backend did not save or run it. Your message is back in the box.')}
  else{keep('The app answered HTTP '+status+' without details; the message may not have been recorded. Your message is back in the box; check the transcript before retrying.')}
  if(cur!==id)st.unread=true;
  await loadRows(id);await refresh();loadCompany().catch(()=>{});if(cur===id){render();loadFlyers(id,selSeq)}
  if(TIMING){fetch('/api/timing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_roundtrip_ms:t1})}).catch(()=>{})}
}
$('send').addEventListener('click',send);
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!e.repeat)send()}});
init();
</script></body></html>
